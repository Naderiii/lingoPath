services:
  postgres:
    image: postgres:16-alpine
    container_name: lingopath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingopath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingopath_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lingopath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingopath} -d ${POSTGRES_DB:-lingopath}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: lingopath-postgres-data
